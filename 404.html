<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面未找到</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 60px 40px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 500px;
            animation: fadeIn 0.6s ease-in;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            color: #4CAF50;
            margin: 0;
            line-height: 1;
            text-shadow: 2px 2px 4px rgba(76, 175, 80, 0.2);
        }
        .error-title {
            font-size: 28px;
            color: #333;
            margin: 20px 0 15px;
            font-weight: 600;
        }
        .error-message {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .home-button {
            display: inline-block;
            padding: 14px 36px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }
        .home-button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(76, 175, 80, 0.4);
        }
        .illustration {
            margin-bottom: 30px;
            font-size: 80px;
        }
        .suggestions {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e0e0e0;
        }
        .suggestions-title {
            font-size: 14px;
            color: #999;
            margin-bottom: 15px;
        }
        .suggestion-link {
            display: block;
            color: #4CAF50;
            text-decoration: none;
            margin: 8px 0;
            font-size: 15px;
            transition: color 0.3s;
        }
        .suggestion-link:hover {
            color: #45a049;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="illustration">🔍</div>
        <h1 class="error-code">404</h1>
        <h2 class="error-title">页面未找到</h2>
        <p class="error-message">抱歉，您访问的页面不存在或已被移除。<br>请检查网址是否正确。</p>
        <a href="/" class="home-button">返回首页</a>
        
        <div class="suggestions">
            <p class="suggestions-title">您可能想要：</p>
            <a href="/" class="suggestion-link">浏览壁纸数据库</a>
            <a href="/?q=风景" class="suggestion-link">搜索风景壁纸</a>
            <a href="/?q=动漫" class="suggestion-link">搜索动漫壁纸</a>
        </div>
    </div>
</body>
</html>
