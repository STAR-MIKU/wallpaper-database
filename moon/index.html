<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Moon相册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f7f7f7;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}

.img-item{
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  aspect-ratio:16/9;
  background:#eee;
  position:relative;
}
.img-item img,
.img-item video{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.3s;
  display:block;
}
.img-item:hover img,
.img-item:hover video{
  transform:scale(1.05);
}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:99}
.modal.show{display:grid}
.modal img, .modal video{
  max-width:100%;
  max-height:90vh;
  object-fit:contain;
}
.close{
  position:absolute;top:20px;right:24px;
  color:#fff;font-size:32px;cursor:pointer;
  background:#000;border-radius:50%;
  width:44px;height:44px;display:grid;place-items:center;
  z-index:2;
}
.prev,.next{
  position:absolute;top:50%;transform:translateY(-50%);
  color:#fff;font-size:28px;padding:16px;cursor:pointer;
  z-index:2;
}
.prev{left:10px}
.next{right:10px}
</style>
</head>

<body>

<div class="img-item">
  <video muted loop autoplay playsinline>
    <source src="/moon/20260320/VID_20260319193350524.jpg" type="video/mp4">
    <img src="/moon/20260320/VID_20260319193350524.jpg" alt="">
  </video>
</div>

<div class="img-item">
  <video muted loop autoplay playsinline>
    <source src="/moon/20260320/VID_20260320035347013.jpg" type="video/mp4">
    <img src="/moon/20260320/VID_20260320035347013.jpg" alt="">
  </video>
</div>

<div class="img-item">
  <video muted loop autoplay playsinline>
    <source src="/moon/20260320/VID_20260320042041424.jpg" type="video/mp4">
    <img src="/moon/20260320/VID_20260320042041424.jpg" alt="">
  </video>
</div>

<div class="modal">
  <div class="close">×</div>
  <div class="prev">‹</div>
  <div class="next">›</div>
  <video class="modal-media" muted loop playsinline style="display:none;"></video>
  <img class="modal-media" src="" style="display:none;">
</div>

<script>
const items = document.querySelectorAll('.img-item');
const modal = document.querySelector('.modal');
const modalMedias = document.querySelectorAll('.modal-media');
const modalImg = modalMedias[1];
const modalVideo = modalMedias[0];
const close = document.querySelector('.close');
const prev = document.querySelector('.prev');
const next = document.querySelector('.next');
let current = 0;

function showMedia(index) {
  const el = items[index];
  const video = el.querySelector('video');
  if (video) {
    modalVideo.src = video.querySelector('source').src;
    modalVideo.style.display = 'block';
    modalImg.style.display = 'none';
    modalVideo.play();
  } else {
    const img = el.querySelector('img');
    modalImg.src = img.src;
    modalImg.style.display = 'block';
    modalVideo.style.display = 'none';
  }
  modal.classList.add('show');
}

items.forEach((el, i) => {
  el.onclick = () => {
    current = i;
    showMedia(current);
  };
});

close.onclick = () => {
  modal.classList.remove('show');
  modalVideo.pause();
};

prev.onclick = () => {
  current = (current - 1 + items.length) % items.length;
  showMedia(current);
};

next.onclick = () => {
  current = (current + 1) % items.length;
  showMedia(current);
};
</script>
</body>
</html>
