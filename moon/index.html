<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Moon相册</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f7f7f7;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.img-item{border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:#eee}
.img-item img{width:100%;height:100%;object-fit:cover;transition:.3s}
.img-item img:hover{transform:scale(1.05)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;place-items:center;z-index:99}
.modal.show{display:grid}
.modal-content{max-width:90%;max-height:90vh;position:relative}
.modal img{max-width:100%;max-height:90vh;object-fit:contain}
.close{position:absolute;top:20px;right:24px;color:#fff;font-size:32px;cursor:pointer;background:#000;border-radius:50%;width:44px;height:44px;display:grid;place-items:center}
.prev,.next{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:28px;padding:16px;cursor:pointer}
.prev{left:10px}
.next{right:10px}
</style>
</head>

<body>
<div class="img-item"><img src="/moon/20260320/VID_20260319193350524.jpg" alt=""></div>
<div class="img-item"><img src="/moon/20260320/VID_20260320035347013.jpg" alt=""></div>
<div class="img-item"><img src="/moon/20260320/VID_20260320042041424.jpg" alt=""></div>

<div class="modal">
<div class="close">×</div>
<div class="prev">‹</div>
<div class="next">›</div>
<img class="modal-img" src="">
</div>

<script>
const items = document.querySelectorAll('.img-item');
const modal = document.querySelector('.modal');
const modalImg = document.querySelector('.modal-img');
const close = document.querySelector('.close');
const prev = document.querySelector('.prev');
const next = document.querySelector('.next');
let current = 0;

items.forEach((el,i)=>{
  el.onclick = ()=>{
    current = i;
    modalImg.src = el.querySelector('img').src;
    modal.classList.add('show');
  }
})

close.onclick = ()=> modal.classList.remove('show');
prev.onclick = ()=>{
  current = (current - 1 + items.length) % items.length;
  modalImg.src = items[current].querySelector('img').src;
}
next.onclick = ()=>{
  current = (current + 1) % items.length;
  modalImg.src = items[current].querySelector('img').src;
}
</script>
</body>
</html>
